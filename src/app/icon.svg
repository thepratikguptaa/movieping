<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- rounded dark tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- "ping" waves emanating from the play tip, brand red, fading out -->
  <g fill="none" stroke="#E50914" stroke-width="3.5" stroke-linecap="round">
    <path d="M44.4 24.3 A10 10 0 0 1 44.4 39.7" opacity="0.9"/>
    <path d="M47.6 20.5 A15 15 0 0 1 47.6 43.5" opacity="0.55"/>
    <path d="M50.9 16.7 A20 20 0 0 1 50.9 47.3" opacity="0.3"/>
  </g>

  <!-- play triangle, brand red (rounded corners via round join) -->
  <path d="M19 18 L19 46 L38 32 Z" fill="#E50914" stroke="#E50914" stroke-width="4" stroke-linejoin="round"/>
</svg>
